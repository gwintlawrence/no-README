# ════════════════════════════════════════════════════════════════
# F4P TRADE DECISION GATE CHECK — MANUAL RUN ONLY
# GWL Trading Team · Fishin4Pips System
#
# FILE LOCATION IN REPO: .github/workflows/f4p_gate_check.yml
#
# WHAT THIS DOES:
#   - setup_idea_book: creates the empty IDEA BOOK tab (once; never touches
#     an existing tab)
#   - setup_news_calendar: creates the empty NEWS CALENDAR tab (once; never
#     touches an existing tab). You type the releases in; the Gate Check flags
#     any near a new idea and suggests a lot size inside your 2% / 10% rules.
#   - gate_check: reads your IDEA BOOK + live feed freshness, checks the new
#     idea, writes the result to a GATE CHECK tab in the Master Macro Scorecard
#
# THE GATE CHECK FLAGS. THE ANALYST SIGNS OFF. It never blocks, places or
# closes a trade, and it never writes into your IDEA BOOK.
#
# NO SCHEDULE ON PURPOSE: click "Run workflow" on the Actions tab.
# SECRET NEEDED: GOOGLE_CREDENTIALS (already set)
# ════════════════════════════════════════════════════════════════

name: F4P Gate Check

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options:
          - gate_check
          - setup_idea_book
          - setup_news_calendar
        default: gate_check
      pair:
        description: "Pair under consideration, e.g. USD/JPY (gate_check only)"
        type: string
        required: false
      direction:
        description: "LONG or SHORT (gate_check only)"
        type: choice
        options:
          - LONG
          - SHORT
        default: LONG
      entry:
        description: "New idea: planned entry price (for the risk check; leave blank to skip)"
        type: string
        required: false
      stop:
        description: "New idea: stop price"
        type: string
        required: false
      target:
        description: "New idea: target price (optional)"
        type: string
        required: false
      lots:
        description: "New idea: lot size, e.g. 0.02"
        type: string
        required: false
      dry_run:
        description: "Dry run: print in the log, do not write the GATE CHECK tab"
        type: boolean
        default: false

jobs:
  gate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-auth google-api-python-client

      - name: Run
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ACTION: ${{ inputs.action }}
          PAIR: ${{ inputs.pair }}
          DIRECTION: ${{ inputs.direction }}
          ENTRY: ${{ inputs.entry }}
          STOP: ${{ inputs.stop }}
          TARGET: ${{ inputs.target }}
          LOTS: ${{ inputs.lots }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$ACTION" = "setup_idea_book" ]; then
            python f4p_gate_check.py --init-idea-book
          elif [ "$ACTION" = "setup_news_calendar" ]; then
            python f4p_news_flag.py --init
          else
            if [ -z "$PAIR" ]; then echo "Please type a pair, e.g. USD/JPY"; exit 1; fi
            EXTRA=""
            if [ "$DRY_RUN" = "true" ]; then EXTRA="--dry-run"; fi
            RISK=""
            if [ -n "$ENTRY" ]; then RISK="$RISK --entry $ENTRY"; fi
            if [ -n "$STOP" ]; then RISK="$RISK --stop $STOP"; fi
            if [ -n "$TARGET" ]; then RISK="$RISK --target $TARGET"; fi
            if [ -n "$LOTS" ]; then RISK="$RISK --lots $LOTS"; fi
            python f4p_gate_check.py --live --pair "$PAIR" --direction "$DIRECTION" $EXTRA $RISK
          fi
