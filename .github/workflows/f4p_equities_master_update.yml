name: F4P Equities Master Weekly Update

# Runs all ten weekly steps in the correct order, in one job, one click:
#   1. f4p_equities_weekly_update.py      - Alpha Vantage data (17 indicators)
#   2. f4p_equities_qualitative_update.py - Claude research (guidance/catalysts)
#   3. setup_thesis_workspace.py          - Thesis Workspace Evidence Layer
#                                            (Phase 3) - reads Step 1's
#                                            indicators and Step 2's
#                                            structured catalyst tab, so it
#                                            must run immediately after both.
#   4. setup_equity_rankings.py           - refresh the ranking formulas
#   5. setup_macro_overlay.py             - Economic block (reuses FX Hub data)
#   6. setup_rates_environment.py         - Rates block (FRED)
#   7. setup_credit_environment.py        - Credit block (FRED)
#   8. setup_equity_regime.py             - Equity Market Regime block (Alpha Vantage)
#   9. setup_vix_environment.py           - VIX block (FRED)
#  10. phase1_engine_role_restructure.py  - ENGINE/ROLE classification,
#                                            STRATEGY DASHBOARD rebuild, AND
#                                            the Market Environment synthesis
#                                            that reads steps 5-9's output
#
# Steps 5-9 were all previously separate, manual-only workflows. Confirmed
# 2026-09-12 that leaving them manual is a real gap, not a convenience:
# Phase 1's dashboard rebuild (step 10) fully overwrites STRATEGY DASHBOARD
# every time it runs, including the Market Environment column - so if
# steps 5-9 don't run first in the SAME cycle, step 10 either writes a
# stale environment read or the placeholder text, silently. Steps 5-9
# must precede step 10 in this same job for that reason - order matters
# here, not just presence. The same is now true of Step 3: it must run
# after Steps 1-2 in the same cycle, or its Evidence columns will read
# stale or N/A instead of this week's real data.
#
# This replaces running these ten workflows manually in sequence.
# Scheduled for Saturday, same cadence as the FX Hub - see the note in
# f4p_equities_weekly_update.yml about why its own schedule was removed
# (this workflow now owns the schedule, to avoid double-running and
# double API cost).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 6"  # Saturday 10:00 UTC - see f4p_equities_weekly_update.yml for the EST/EDT note

jobs:
  master_update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install gspread google-auth requests anthropic

      - name: "Step 1 - Alpha Vantage data (17 indicators)"
        run: python f4p_equities_weekly_update.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          EQUITIES_SHEET_ID: ${{ secrets.EQUITIES_SHEET_ID }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

      - name: "Step 2 - Claude research (Forward Guidance + Catalyst Pipeline)"
        run: python f4p_equities_qualitative_update.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          EQUITIES_SHEET_ID: ${{ secrets.EQUITIES_SHEET_ID }}

      - name: "Step 3 - Thesis Workspace Evidence Layer (Phase 3)"
        run: python setup_thesis_workspace.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          EQUITIES_SHEET_ID: ${{ secrets.EQUITIES_SHEET_ID }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

      - name: "Step 4 - Refresh ranking formulas"
        run: python setup_equity_rankings.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          EQUITIES_SHEET_ID: ${{ secrets.EQUITIES_SHEET_ID }}

      - name: "Step 5 - Economic Environment (macro overlay)"
        run: python setup_macro_overlay.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          EQUITIES_SHEET_ID: ${{ secrets.EQUITIES_SHEET_ID }}

      - name: "Step 6 - Rates Environment"
        run: python setup_rates_environment.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          EQUITIES_SHEET_ID: ${{ secrets.EQUITIES_SHEET_ID }}

      - name: "Step 7 - Credit Environment"
        run: python setup_credit_environment.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          EQUITIES_SHEET_ID: ${{ secrets.EQUITIES_SHEET_ID }}

      - name: "Step 8 - Equity Market Regime"
        run: python setup_equity_regime.py
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          EQUITIES_SHEET_ID: ${{ secrets.EQUITIES_SHEET_ID }}

      - name: "Step 9 - VIX Environment"
        run: python setup_vix_environment.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          EQUITIES_SHEET_ID: ${{ secrets.EQUITIES_SHEET_ID }}

      - name: "Step 10 - ENGINE/ROLE classification, Dashboard + Market Environment"
        run: python phase1_engine_role_restructure.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          EQUITIES_SHEET_ID: ${{ secrets.EQUITIES_SHEET_ID }}

    
