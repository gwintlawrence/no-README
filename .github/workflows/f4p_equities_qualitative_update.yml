name: F4P Equities Qualitative Update (Claude Research)

# Standalone/manual runner for f4p_equities_qualitative_update.py -
# Forward Guidance + Catalyst Pipeline research via Claude with web
# search, plus the Phase 3 structured catalyst tab (THESIS WORKSPACE
# CATALYSTS).
#
# This step already runs automatically, in the correct order, as Step 2
# of f4p_equities_master_update.yml. This standalone workflow exists only
# for manually re-running or testing this one step on its own - it has
# no schedule of its own (the master workflow owns the weekly cron, to
# avoid double-running and double API cost).
#
# RUN ORDER if triggered standalone: must run AFTER
# f4p_equities_weekly_update.py (Step 1) has run this cycle, and BEFORE
# setup_thesis_workspace.py (Step 3), since that script reads the
# THESIS WORKSPACE CATALYSTS tab this script writes.

on:
  workflow_dispatch:

jobs:
  qualitative_update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install gspread google-auth anthropic

      - name: "Run Claude research (Forward Guidance + Catalyst Pipeline)"
        run: python f4p_equities_qualitative_update.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          EQUITIES_SHEET_ID: ${{ secrets.EQUITIES_SHEET_ID }}

    
