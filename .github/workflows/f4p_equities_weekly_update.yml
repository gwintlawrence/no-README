name: F4P Equities Weekly Update

# Manual-trigger only. The Saturday schedule lives in
# f4p_equities_master_update.yml, which calls this script as Step 1 of 3
# (Alpha Vantage data -> Claude research -> ranking refresh) in one run.
# This file used to also carry its own Saturday cron, which caused
# f4p_equities_weekly_update.py to run twice every Saturday - double
# Alpha Vantage cost, two processes racing to write EQUITIES HUB DATA
# at once. Removed 2026-09-07 - keep this dispatch-only.

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install gspread google-auth requests

      - run: python f4p_equities_weekly_update.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          EQUITIES_SHEET_ID: ${{ secrets.EQUITIES_SHEET_ID }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
