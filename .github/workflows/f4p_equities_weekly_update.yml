name: F4P Equities Weekly Update

on:
  workflow_dispatch:
  schedule:
    # Saturday 6am ET data collection, same cadence as the FX pipeline.
    # Cron is UTC - 10:00 UTC covers both EST (6am) and EDT (6am) close enough;
    # adjust if daylight saving drift matters to you.
    - cron: "0 10 * * 6"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install gspread google-auth requests

      - run: python f4p_equities_weekly_update.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          EQUITIES_SHEET_ID: ${{ secrets.EQUITIES_SHEET_ID }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

    
